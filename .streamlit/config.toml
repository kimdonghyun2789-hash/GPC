# MML 테마 설정 (PRD 19.2 컬러 컨셉)
# 메인: 딥 그린 / 강조: 오렌지 / 배경: 밝은 회색 / 카드: 흰색
[theme]
primaryColor = "#E8722B"            # 강조(오렌지) - 주요 버튼/포인트
backgroundColor = "#FFFFFF"          # 본문 배경(흰색)
secondaryBackgroundColor = "#F4F6F8" # 보조 배경(밝은 회색) - 칩/카드
textColor = "#1F2A37"                # 본문 글자색
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
